<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Kasir - Pisang Lamak</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        .error { color: red; font-size: 14px; margin-bottom: 15px; background: #ffe6e6; padding: 10px; border-radius: 5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #e68a00; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>🔒 Login Kasir</h2>
    
    <!-- Notifikasi jika password salah -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    
    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Masukkan Username..." required>
        <input type="password" name="password" placeholder="Masukkan Password..." required>
        <button type="submit">Login ke Sistem</button>
    </form>
</div>

</body>
</html>
